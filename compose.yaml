name: orbitops-lab
services:
  jenkins:
    build:
      context: ./jenkins
    container_name: orbitops-jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "${JENKINS_HTTP_PORT:-8081}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace/orbitops:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  portainer:
    image: portainer/portainer-ce:lts
    container_name: orbitops-portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  jenkins_home:
  portainer_data:
